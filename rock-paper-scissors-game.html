<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src = "javascript.js"></script>
    <header class="header">
        <div class="title-top">Game of</div>
        <div class="title-bottom">Rock Paper Scissors</div>
    </header>

    <main class="game-board">
        <h2 class="prompt-text">Make your choice</h2>

        <div class="choices-container">
            <!--Rock Card-->
            <button class="choice-card rock" type="button" aria-label="Choose Rock">
                
                <svg class="choice-icon" viewBox="0 0 100 100" width="150" height="150" xmlns="http://w3.org">
                <!-- Πάνω αριστερή έδρα -->
                <path d="M 31.5 27.5 L 67.5 16.5 L 57.5 34.5 L 34.5 50.5 Z" fill="#7D7D7D" />
                
                <!-- Πάνω δεξιά φωτεινή έδρα -->
                <path d="M 67.5 16.5 L 87 50.5 L 71.5 51.5 L 57.5 34.5 Z" fill="#9E9E9E" />
                
                <!-- Αριστερή σκούρα έδρα -->
                <path d="M 31.5 27.5 L 34.5 50.5 L 32.5 70.5 L 16.5 72 L 13 51.5 Z" fill="#525252" />
                
                <!-- Κεντρική μεγάλη έδρα -->
                <path d="M 34.5 50.5 L 57.5 34.5 L 71.5 51.5 L 58.5 74.5 L 32.5 70.5 Z" fill="#737373" />
                
                <!-- Δεξιά μεσαία έδρα -->
                <path d="M 71.5 51.5 L 87 50.5 L 87 70.5 L 72 83.5 L 58.5 74.5 Z" fill="#828282" />
                
                <!-- Κάτω αριστερή σκούρα έδρα -->
                <path d="M 16.5 72 L 32.5 70.5 L 28 83.5 Z" fill="#3D3D3D" />
                
                <!-- Κάτω βάση (σκιά) -->
                <path d="M 32.5 70.5 L 58.5 74.5 L 72 83.5 L 28 83.5 Z" fill="#2E2E2E" />
                </svg>
                <span class="choice-label">Rock</span>
            </button>
                  <!-- Paper Card -->
            <button class="choice-card paper" type="button" aria-label="Choose Paper">
                <svg class="choice-icon" viewBox="0 0 100 100" width="150" height="150" xmlns="http://w3.org">
                <!-- Κύριο σώμα σελίδας -->
                <path d="M 18 8 L 58 8 L 82 32 L 82 92 L 18 92 Z" fill="#F2F2F2" stroke="#D1D1D1" stroke-width="1.5" />
                
                <!-- Σκιά κάτω από τη διπλωμένη γωνία -->
                <path d="M 58 8 L 58 34 L 82 32 Z" fill="#D6D6D6" />
                
                <!-- Διπλωμένη γωνία (Page Curl) -->
                <path d="M 58 8 C 61 18 61 28 58 32 C 64 29 74 29 82 32 Z" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1" />

                <!-- Γραμμές κειμένου -->
                <path d="
                    M 28 22 H 44
                    M 28 29 H 52
                    M 28 36 H 68
                    M 28 43 H 72
                    M 28 50 H 64
                    M 28 57 H 70
                    M 28 64 H 66
                    M 28 71 H 72
                    M 28 78 H 58
                    M 28 85 H 46" 
                    stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span class="choice-label">Paper</span>
            </button>

            <!-- Scissors Card -->
            <button class="choice-card scissors" type="button" aria-label="Choose Scissors">
                <svg class="choice-icon" viewBox="0 0 100 100" width="150" height="150" xmlns="http://w3.org">
                <!-- Αριστερή λεπίδα -->
                <path d="M 55 43 L 24 89 C 21 91 20 88 22 83 L 45 41 Z" fill="#8C969E" />
                
                <!-- Δεξιά λεπίδα -->
                <path d="M 45 43 L 76 89 C 79 91 80 88 78 83 L 55 41 Z" fill="#ABB3BA" />

                <!-- Πράσινες λαβές (fill-rule="evenodd" για να δημιουργηθούν οι τρύπες) -->
                <path fill-rule="evenodd" fill="#189E59" d="
                    M 46 43 L 38 22 C 32 10 14 10 12 24 C 10 38 25 43 38 39 L 44 45 Z
                    M 23 20 C 17 20 17 32 26 32 C 32 32 32 20 23 20 Z
                    M 54 43 L 62 22 C 68 10 86 10 88 24 C 90 38 75 43 62 39 L 56 45 Z
                    M 77 20 C 83 20 83 32 74 32 C 68 32 68 20 77 20 Z" />

                <!-- Κεντρική βίδα / άξονας -->
                <circle cx="50" cy="46" r="6" fill="#C4CCD1" />
                <circle cx="50" cy="46" r="2" fill="#70787E" />
                </svg>
                <span class="choice-label">Scissors</span>
            </button>
        </div>

        <div class="rules-text">First to 5 wins!</div>
        <!-- Scoreboard -->
        <div class="scoreboard">
        <div class="score-side">
            <span class="player-label">You</span>
            <span class="score-number score-you">2</span>
        </div>

        <div class="score-badge">
            <span>Score</span>
            <div class="score-dot"></div>
        </div>

        <div class="score-side">
            <span class="player-label">Computer</span>
            <span class="score-number score-computer">5</span>
        </div>
        </div>

        <!-- Result Message -->
        <div class="result-message">
        <span class="status-dot"></span>
        <span>The computer won the game. rock beats scissors.</span>
        </div>

        <!-- Action Button -->
        <button class="play-again-btn" type="button">
        Play again <span>&#8599;</span>
        </button>

    </main>

</body>
</html>
